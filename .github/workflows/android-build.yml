name: Build Calculator Vault APK

# Собирает debug-APK приложения из папки calculator-vault.
# Запускается при изменениях в этой папке и вручную (кнопка "Run workflow").
on:
  push:
    paths:
      - 'calculator-vault/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'calculator-vault/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calculator-vault
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-vault-debug-apk
          path: calculator-vault/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
